apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchantguard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: merchantguard-api
  template:
    metadata:
      labels:
        app: merchantguard-api
    spec:
      containers:
        - name: merchantguard-api
          image: ghcr.io/amna-albasher/merchantguard-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: merchantguard-service
spec:
  type: NodePort
  selector:
    app: merchantguard-api
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
