name: MerchantGuard CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-validate-build:
    name: Test, validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate synthetic dataset
        run: python src/generate_data.py

      - name: Generate drifted dataset
        run: python monitoring/evidently/generate_drifted_data.py

      - name: Run drift monitoring and automatic retraining
        run: python monitoring/evidently/drift_report.py

      - name: Train candidate model
        run: python src/train_model.py

      - name: Run validation gate
        run: python src/validate_model.py

      - name: Export approved champion
        run: python src/export_champion.py

      - name: Run automated tests
        run: pytest -v

      - name: Set container image name
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/merchantguard-api" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Test container health
        shell: bash
        run: |
          docker run -d \
            --name merchantguard-ci \
            -p 8000:8000 \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          for attempt in {1..12}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 5
          done

          docker logs merchantguard-ci
          exit 1

  deploy:
    name: Deploy to local Kubernetes
    needs: test-validate-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply Kubernetes configuration
        shell: powershell
        run: |
          kubectl apply -f k8s/merchantguard.yaml

      - name: Deploy new image
        shell: powershell
        run: |
          kubectl set image deployment/merchantguard-api merchantguard-api=ghcr.io/amna-albasher/merchantguard-api:${{ github.sha }}

      - name: Wait for Kubernetes rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/merchantguard-api --timeout=180s

      - name: Verify Kubernetes deployment
        shell: powershell
        run: |
          kubectl get pods
          kubectl get service merchantguard-service

      - name: Verify deployed API health
        shell: powershell
        run: |
          $portForward = Start-Process `
            -FilePath "kubectl" `
            -ArgumentList "port-forward","service/merchantguard-service","18001:80" `
            -PassThru `
            -WindowStyle Hidden

          try {
            Start-Sleep -Seconds 5

            $response = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18001/health" `
              -Method Get

            Write-Host "MerchantGuard health check passed:"
            Write-Host ($response | ConvertTo-Json -Compress)
          }
          finally {
            Stop-Process -Id $portForward.Id -Force -ErrorAction SilentlyContinue
          }